<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>验证码标记工具</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d9dde3;
    --text: #24292f; --muted: #6b7280; --accent: #2f6feb; --accent2: #1f5fd0;
    --ok: #1a7f37; --err: #d1242f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 16px; position: sticky; top: 0; z-index: 5; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  label { color: var(--muted); font-size: 13px; }
  select, input[type=text], input[type=number], input[type=password] {
    padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; background: #fff; color: var(--text);
  }
  button {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 14px; color: var(--text);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent2); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #dirInfo { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; }
  .tabs button {
    border-radius: 8px 8px 0 0; border-bottom: none; padding: 8px 18px;
    background: transparent; font-weight: 600;
  }
  .tabs button.active { background: var(--panel); color: var(--accent); border-color: var(--border); }
  main { display: flex; gap: 14px; padding: 14px 16px; align-items: flex-start; }
  .hidden { display: none !important; }
  .col-main { flex: 1; min-width: 0; }
  .col-side { width: 260px; flex: none; }

  /* 未标记 */
  .preview-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #bigPreview { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  #previewMeta { color: var(--muted); font-size: 13px; word-break: break-all; text-align: center; }
  .input-row { display: flex; gap: 8px; margin-top: 10px; }
  #labelInput, #editInput {
    flex: 1; font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
    font-family: "Menlo", "Consolas", monospace; text-align: center; padding: 8px;
  }
  #statusBar { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 20px; }
  #statusBar.err { color: var(--err); }
  #statusBar.ok { color: var(--ok); }
  .thumb-strip {
    margin-top: 12px; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px;
  }
  .thumb { position: relative; cursor: pointer; border: 2px solid transparent; border-radius: 6px; }
  .thumb img { display: block; width: 56px; height: auto; border-radius: 4px; }
  .thumb.done { opacity: .45; }
  .thumb.active { border-color: var(--accent); }
  .thumb .idx { position: absolute; bottom: 0; right: 2px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; padding: 0 3px; border-radius: 3px; }

  /* 拖拽上传 */
  #dropZone {
    border: 2px dashed var(--border); border-radius: 10px; padding: 26px 10px;
    text-align: center; color: var(--muted); cursor: pointer; background: var(--panel);
  }
  #dropZone.dragover { border-color: var(--accent); color: var(--accent); background: #eef4ff; }

  /* 已标记 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .cell {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; cursor: pointer; text-align: center;
  }
  .cell img { width: 100%; height: auto; border-radius: 4px; display: block; }
  .cell .lbl { margin-top: 6px; font-size: 13px; font-family: Menlo, monospace; color: var(--text); word-break: break-all; }
  .cell:hover { border-color: var(--accent); }
  .cell.selected { border-color: var(--accent); box-shadow: 0 0 0 2px #b6d0ff; }
  .edit-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 90px; }
  #editPreview { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; align-self: center; }
  #editInfo { font-size: 13px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<header>
  <div class="row">
    <label>批次目录</label>
    <select id="dirSelect"></select>
    <input type="text" id="newDirInput" placeholder="新批次名" style="width:130px">
    <button id="btnNewDir">新建目录</button>
    <button id="btnRefresh">刷新</button>
    <span class="spacer"></span>
    <label>最小长度</label>
    <input type="number" id="minLenInput" min="1" max="32" style="width:64px">
    <label>最大长度</label>
    <input type="number" id="maxLenInput" min="1" max="32" style="width:64px">
    <label><input type="checkbox" id="upperCheck"> 大写</label>
    <button id="btnSaveCfg" class="primary">保存配置</button>
  </div>
  <div id="dirInfo">请选择批次目录</div>
</header>

<nav class="tabs">
  <button id="tabUnlabeled" class="active">未标记标注</button>
  <button id="tabLabeled">已标记修改</button>
</nav>

<main>
  <!-- 未标记标注 -->
  <section id="panelUnlabeled" class="col-main">
    <div class="col-main">
      <div class="preview-box">
        <img id="bigPreview" alt="" style="display:none">
        <div id="previewMeta">尚未选择图片</div>
      </div>
      <div class="input-row">
        <input id="labelInput" placeholder="输入标签，回车保存" autocomplete="off" spellcheck="false">
        <button id="btnSave" class="primary">保存 (Enter)</button>
        <button id="btnSkip">跳过</button>
      </div>
      <div id="statusBar"></div>
      <div id="thumbStrip" class="thumb-strip"></div>
    </div>
  </section>
  <section id="panelUnlabeledSide" class="col-side">
    <div id="dropZone">拖拽图片/压缩包到这里，或点击选择<br><span style="font-size:12px">自动导入到当前批次 raw/ 目录</span></div>
    <input type="file" id="fileInput" multiple accept="image/png,image/jpeg,image/bmp,image/webp,.zip,.7z" hidden>
    <button id="btnUploadZip" style="width:100%; margin-top:8px">上传压缩包 (.zip / .7z)</button>
    <input type="file" id="zipInput" accept=".zip,.7z" hidden>
  </section>

  <!-- 已标记修改 -->
  <section id="panelLabeled" class="col-main hidden">
    <div class="col-main">
      <div id="labeledGrid" class="grid"></div>
    </div>
  </section>
  <section id="panelLabeledSide" class="col-side hidden">
    <div class="edit-box">
      <img id="editPreview" alt="" style="display:none">
      <input id="editInput" autocomplete="off" spellcheck="false" placeholder="新标签">
      <button id="btnModify" class="primary">保存修改 (Enter)</button>
      <div id="editInfo">点击左侧图片以修改标签</div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const enc = encodeURIComponent;
const state = {
  dir: null, unlabeled: [], idx: 0,
  labeled: [], selLabeled: null,
  cfg: { length: 5, uppercase: true },
};

/* ---------- API 封装 ---------- */
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  let data = {};
  try { data = await r.json(); } catch (_) {}
  if (!r.ok || data.error) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
const post = (path, body) => api(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body),
});
const imgUrl = (kind, dir, file, scale = 1) =>
  `/api/image?kind=${kind}&dir=${enc(dir)}&file=${enc(file)}&scale=${scale}`;

/* ---------- 工具 ---------- */
function setStatus(msg, cls) {
  const el = $("#statusBar");
  el.textContent = msg || "";
  el.className = cls ? cls : "";
}
function setEditInfo(msg) { $("#editInfo").textContent = msg; }
function normalizeLabel(v) {
  let s = (v || "").trim();
  if (state.cfg.uppercase) s = s.toUpperCase();
  return s;
}
function fmtProg() {
  return `第 ${Math.min(state.idx + 1, state.unlabeled.length)} / ${state.unlabeled.length} 张`;
}

/* ---------- 目录 / 配置 ---------- */
async function loadDirs() {
  const d = await api("/api/dirs");
  const sel = $("#dirSelect");
  const prev = state.dir;
  sel.innerHTML = "";
  if (!d.dirs.length) {
    sel.innerHTML = '<option value="">(暂无批次，请新建)</option>';
    state.dir = null;
  } else {
    for (const it of d.dirs) {
      const o = document.createElement("option");
      o.value = it.name;
      o.textContent = `${it.name}  (未标 ${it.rawCount} / 已标 ${it.labeledCount})`;
      sel.appendChild(o);
    }
    const target = (prev && d.dirs.some(x => x.name === prev)) ? prev : d.dirs[0].name;
    sel.value = target;
    state.dir = target;
  }
  if (state.dir) {
    const it = d.dirs.find(x => x.name === state.dir);
    $("#dirInfo").textContent = it
      ? `未标记 ${it.rawCount} 张  /  已标记 ${it.labeledCount} 张`
      : "";
  } else {
    $("#dirInfo").textContent = "请选择批次目录";
  }
  await Promise.all([loadUnlabeled(), loadLabeled()]);
}

async function refreshAll() {
  try { await loadDirs(); } catch (e) { setStatus("刷新失败: " + e.message, "err"); }
}

async function createDir() {
  const name = $("#newDirInput").value.trim();
  if (!name) return setStatus("请输入批次目录名", "err");
  try {
    await post("/api/dirs/create", { name });
    $("#newDirInput").value = "";
    await loadDirs();
    $("#dirSelect").value = name; state.dir = name;
    await Promise.all([loadUnlabeled(), loadLabeled()]);
    setStatus("已新建目录: " + name, "ok");
  } catch (e) { setStatus("新建失败: " + e.message, "err"); }
}

async function loadConfig() {
  try {
    const c = await api("/api/config");
    state.cfg = c;
    $("#minLenInput").value = c.minLength;
    $("#maxLenInput").value = c.maxLength;
    $("#upperCheck").checked = !!c.uppercase;
  } catch (_) {}
}
async function saveConfig() {
  const minLength = parseInt($("#minLenInput").value, 10) || 1;
  const maxLength = parseInt($("#maxLenInput").value, 10) || 6;
  const uppercase = $("#upperCheck").checked;
  try {
    const d = await post("/api/config", { minLength, maxLength, uppercase });
    state.cfg = d.config;
    setStatus("配置已保存（长度 " + d.config.minLength + "-" + d.config.maxLength + "，大写 " + (d.config.uppercase ? "开" : "关") + "）", "ok");
  } catch (e) { setStatus("保存配置失败: " + e.message, "err"); }
}

/* ---------- 未标记标注 ---------- */
async function loadUnlabeled() {
  if (!state.dir) { state.unlabeled = []; state.idx = 0; showUnlabeled(); return; }
  const d = await api(`/api/unlabeled?dir=${enc(state.dir)}`);
  state.unlabeled = d.files || [];
  if (state.idx >= state.unlabeled.length) state.idx = Math.max(0, state.unlabeled.length - 1);
  showUnlabeled();
}

function showUnlabeled() {
  const img = $("#bigPreview");
  const meta = $("#previewMeta");
  const input = $("#labelInput");
  const btn = $("#btnSave");
  const files = state.unlabeled;
  if (!state.dir || !files.length) {
    img.style.display = "none";
    meta.textContent = state.dir ? "全部标记完成！" : "请先选择批次目录";
    input.value = "";
    input.disabled = true; btn.disabled = true; $("#btnSkip").disabled = true;
    renderThumbs();
    setStatus(state.dir ? "当前批次已全部标记" : "");
    return;
  }
  const filename = files[state.idx];
  img.src = imgUrl("raw", state.dir, filename, 2);
  img.style.display = "block";
  meta.textContent = `${fmtProg()} · ${filename}`;
  input.disabled = false; btn.disabled = false; $("#btnSkip").disabled = false;
  input.value = "";
  input.focus();
  renderThumbs();
  prefillFor(filename);
}

async function prefillFor(filename) {
  const dir = state.dir;
  if (!dir) return;
  try {
    const d = await post("/api/prefill", { dir, filename });
    if (state.dir !== dir) return;
    const files = state.unlabeled;
    if (files[state.idx] !== filename) return;
    const input = $("#labelInput");
    if (!input.value && d.text) input.value = d.text;
    setStatus("OCR 预填: " + (d.text || "(未能识别)"));
  } catch (_) { /* 预填失败不打扰 */ }
}

function renderThumbs() {
  const strip = $("#thumbStrip");
  strip.innerHTML = "";
  state.unlabeled.forEach((f, i) => {
    const t = document.createElement("div");
    t.className = "thumb" + (i === state.idx ? " active" : "") + (i < state.idx ? " done" : "");
    t.title = f;
    const img = document.createElement("img");
    img.src = imgUrl("raw", state.dir, f, 1);
    img.loading = "lazy";
    const idx = document.createElement("span");
    idx.className = "idx"; idx.textContent = i + 1;
    t.appendChild(img); t.appendChild(idx);
    t.onclick = () => { state.idx = i; showUnlabeled(); };
    strip.appendChild(t);
  });
}

async function saveLabel() {
  const dir = state.dir;
  if (!dir || state.idx >= state.unlabeled.length) return;
  const filename = state.unlabeled[state.idx];
  const label = normalizeLabel($("#labelInput").value);
  if (!label) return setStatus("请输入标签", "err");
  try {
    const d = await post("/api/save_label", { dir, filename, label });
    state.unlabeled.splice(state.idx, 1);   // 保存后从列表移除
    if (state.idx >= state.unlabeled.length && state.unlabeled.length > 0)
      state.idx = state.unlabeled.length - 1;
    showUnlabeled();
    refreshDirsCount();
    setStatus("已保存: " + d.saved, "ok");
  } catch (e) { setStatus("保存失败: " + e.message, "err"); }
}

function skipLabel() {
  if (state.idx < state.unlabeled.length - 1) state.idx++;
  showUnlabeled();
}

async function refreshDirsCount() {
  try {
    const d = await api("/api/dirs");
    const it = d.dirs.find(x => x.name === state.dir);
    if (it) $("#dirInfo").textContent = `未标记 ${it.rawCount} 张  /  已标记 ${it.labeledCount} 张`;
  } catch (_) {}
}

/* ---------- 上传 ---------- */
function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || "");
      const i = s.indexOf(",");
      resolve(i >= 0 ? s.slice(i + 1) : "");
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function uploadFiles(fileList) {
  const dir = state.dir;
  if (!dir) return setStatus("请先选择批次目录再上传", "err");
  const files = Array.from(fileList).filter(f =>
    /\.(png|jpe?g|bmp|webp|zip|7z)$/i.test(f.name));
  if (!files.length) return setStatus("没有可识别的图片或压缩包", "err");
  let imgOk = 0, arcOk = 0;
  for (const f of files) {
    const ext = "." + (f.name.split(".").pop() || "").toLowerCase();
    try {
      const data = await readAsBase64(f);
      if (ext === ".zip" || ext === ".7z") {
        const d = await post("/api/extract_archive", { dir, filename: f.name, data });
        arcOk += d.imported || 0;
      } else {
        await post("/api/upload", { dir, filename: f.name, data });
        imgOk++;
      }
    } catch (e) { setStatus((ext === ".zip" || ext === ".7z" ? "解压失败 " : "上传失败 ") + f.name + ": " + e.message, "err"); }
  }
  if (imgOk || arcOk) {
    await loadUnlabeled();
    await refreshDirsCount();
    setStatus("已导入 " + imgOk + " 张图片，压缩包解压 " + arcOk + " 张", "ok");
  } else {
    setStatus("没有成功导入任何文件", "err");
  }
}

/* ---------- 已标记修改 ---------- */
async function loadLabeled() {
  if (!state.dir) { state.labeled = []; state.selLabeled = null; renderGrid(); return; }
  const d = await api(`/api/labeled?dir=${enc(state.dir)}`);
  state.labeled = d.files || [];
  if (state.selLabeled && !state.labeled.find(x => x.filename === state.selLabeled))
    state.selLabeled = null;
  renderGrid();
}

function renderGrid() {
  const grid = $("#labeledGrid");
  grid.innerHTML = "";
  if (!state.dir || !state.labeled.length) {
    grid.innerHTML = '<div style="color:var(--muted)">该批次暂无已标记数据</div>';
    showEdit(null);
    return;
  }
  for (const it of state.labeled) {
    const c = document.createElement("div");
    c.className = "cell" + (it.filename === state.selLabeled ? " selected" : "");
    const img = document.createElement("img");
    img.src = imgUrl("labeled", state.dir, it.filename, 1);
    img.loading = "lazy";
    const lbl = document.createElement("div");
    lbl.className = "lbl"; lbl.textContent = it.label;
    c.appendChild(img); c.appendChild(lbl);
    c.onclick = () => { state.selLabeled = it.filename; renderGrid(); showEdit(it); };
    grid.appendChild(c);
  }
  if (state.selLabeled) {
    const it = state.labeled.find(x => x.filename === state.selLabeled);
    if (it) showEdit(it);
  }
}

function showEdit(it) {
  const img = $("#editPreview");
  const input = $("#editInput");
  if (!it || !state.dir) {
    img.style.display = "none";
    input.value = "";
    input.disabled = true; $("#btnModify").disabled = true;
    setEditInfo(it ? "" : "点击左侧图片以修改标签");
    return;
  }
  img.src = imgUrl("labeled", state.dir, it.filename, 2);
  img.style.display = "block";
  input.value = it.label;
  input.disabled = false; $("#btnModify").disabled = false;
  setEditInfo(`${it.filename}\n原文件名: ${it.original || "-"}`);
  input.focus();
}

async function modifyLabel() {
  if (!state.dir || !state.selLabeled) return;
  const filename = state.selLabeled;
  const label = normalizeLabel($("#editInput").value);
  if (!label) return setEditInfo("请输入新标签");
  try {
    const d = await post("/api/modify_label", { dir: state.dir, filename, label });
    await loadLabeled();
    state.selLabeled = d.saved;
    renderGrid();
    refreshDirsCount();
    setEditInfo("已修改: " + d.saved);
  } catch (e) { setEditInfo("修改失败: " + e.message); }
}

/* ---------- 页签 ---------- */
function switchTab(which) {
  $("#tabUnlabeled").classList.toggle("active", which === "unlabeled");
  $("#tabLabeled").classList.toggle("active", which === "labeled");
  $("#panelUnlabeled").classList.toggle("hidden", which !== "unlabeled");
  $("#panelUnlabeledSide").classList.toggle("hidden", which !== "unlabeled");
  $("#panelLabeled").classList.toggle("hidden", which !== "labeled");
  $("#panelLabeledSide").classList.toggle("hidden", which !== "labeled");
  if (which === "labeled" && !state.selLabeled && state.labeled.length) {
    state.selLabeled = state.labeled[0].filename;
    renderGrid();
  }
  if (which === "unlabeled") $("#labelInput").focus();
}

/* ---------- 事件绑定 ---------- */
$("#dirSelect").addEventListener("change", async (e) => {
  state.dir = e.target.value || null;
  state.idx = 0; state.selLabeled = null;
  await Promise.all([loadUnlabeled(), loadLabeled()]);
  await refreshDirsCount();
});
$("#btnNewDir").addEventListener("click", createDir);
$("#newDirInput").addEventListener("keydown", e => { if (e.key === "Enter") createDir(); });
$("#btnRefresh").addEventListener("click", refreshAll);
$("#btnSaveCfg").addEventListener("click", saveConfig);
$("#btnSave").addEventListener("click", saveLabel);
$("#btnSkip").addEventListener("click", skipLabel);
$("#labelInput").addEventListener("keydown", e => { if (e.key === "Enter") saveLabel(); });
$("#labelInput").addEventListener("input", e => {
  if (state.cfg.uppercase) e.target.value = e.target.value.toUpperCase();
});
$("#editInput").addEventListener("keydown", e => { if (e.key === "Enter") modifyLabel(); });
$("#editInput").addEventListener("input", e => {
  if (state.cfg.uppercase) e.target.value = e.target.value.toUpperCase();
});
$("#btnModify").addEventListener("click", modifyLabel);
$("#tabUnlabeled").addEventListener("click", () => switchTab("unlabeled"));
$("#tabLabeled").addEventListener("click", () => switchTab("labeled"));

const dz = $("#dropZone");
const fi = $("#fileInput");
const zi = $("#zipInput");
dz.addEventListener("click", () => fi.click());
$("#btnUploadZip").addEventListener("click", () => zi.click());
zi.addEventListener("change", async (e) => {
  await uploadFiles(e.target.files);
  zi.value = "";
});
fi.addEventListener("change", async (e) => {
  await uploadFiles(e.target.files);
  fi.value = "";
});
["dragover", "dragenter"].forEach(ev => dz.addEventListener(ev, (e) => {
  e.preventDefault(); dz.classList.add("dragover");
}));
["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, (e) => {
  e.preventDefault(); dz.classList.remove("dragover");
}));
dz.addEventListener("drop", async (e) => {
  await uploadFiles(e.dataTransfer.files);
});

/* ---------- 启动 ---------- */
(async function init() {
  await loadConfig();
  try { await loadDirs(); } catch (e) { setStatus("初始化失败: " + e.message, "err"); }
  switchTab("unlabeled");
})();
</script>
</body>
</html>
