<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>验证码识别工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f0f2f5; color: #1f2328; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 40px 16px;
  }
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08);
    padding: 32px; width: 100%; max-width: 620px; margin-bottom: 24px; align-self: center;
  }
  .card.wide { max-width: 960px; }
  h1 { font-size: 22px; }
  .sub { color: #656d76; font-size: 13px; margin: 6px 0 20px; }
  .sub code { background: #f6f8fa; padding: 1px 5px; border-radius: 4px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #57606a; margin-bottom: 6px; }
  select {
    width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #d0d7de;
    border-radius: 8px; background: #fff; color: #1f2328;
  }
  .drop {
    border: 2px dashed #c9ccd1; border-radius: 8px; padding: 28px 16px;
    text-align: center; color: #57606a; cursor: pointer; transition: all .15s;
  }
  .drop.dragover { border-color: #0969da; background: #f0f6ff; color: #0969da; }
  .drop p { font-size: 14px; }
  .drop small { display: block; margin-top: 6px; font-size: 12px; color: #8b949e; }
  .preview { margin-top: 16px; text-align: center; display: none; }
  .preview img {
    max-width: 100%; max-height: 180px; border: 1px solid #e1e4e8;
    border-radius: 8px; image-rendering: pixelated;
  }
  .btn {
    width: 100%; padding: 12px; font-size: 15px;
    background: #0969da; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  .btn:disabled { background: #c9ccd1; cursor: not-allowed; }
  .btn-row { display: flex; gap: 12px; margin-top: 16px; }
  .btn-row .btn { flex: 1; }
  .btn.secondary { background: #eaeef2; color: #1f2328; }
  .btn.secondary:disabled { background: #eaeef2; color: #8b949e; }
  .result { margin-top: 20px; display: none; }
  .text-box {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px;
  }
  .text-box .lbl { font-size: 13px; color: #57606a; }
  .captcha {
    font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 40px;
    font-weight: 700; letter-spacing: 6px; color: #0969da;
  }
  .meta { text-align: center; font-size: 13px; color: #57606a; margin-top: 10px; }
  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 13px; color: #57606a; }
  ul { list-style: none; margin-top: 8px; }
  li {
    display: flex; justify-content: space-between; padding: 6px 10px;
    font-size: 13px; border-radius: 6px;
  }
  li:nth-child(odd) { background: #f6f8fa; }
  li .lbl2 { color: #57606a; }
  li .txt2 { font-family: "SF Mono", Consolas, monospace; font-weight: 600; }
  .err {
    margin-top: 16px; padding: 12px; border-radius: 8px; background: #fff1f0;
    border: 1px solid #ffccc7; color: #cf222e; font-size: 13px; display: none;
  }
  .progress-wrap { display: none; margin-top: 16px; }
  .progress-bar {
    width: 100%; height: 10px; background: #eaeef2; border-radius: 5px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; background: #0969da; border-radius: 5px; transition: width .3s;
  }
  .progress-text { text-align: center; font-size: 13px; color: #57606a; margin-top: 8px; }
  .batch-stats { display: none; margin-top: 16px; font-size: 14px; }
  .batch-stats .stat { font-weight: 600; }
  .stat.ok { color: #1a7f37; }
  .stat.bad { color: #cf222e; }
  .filter { display: none; margin-top: 10px; font-size: 13px; color: #57606a; }
  .filter input { margin-right: 6px; }
  .table-wrap { display: none; margin-top: 12px; max-height: 60vh; overflow: auto;
    border: 1px solid #e1e4e8; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0; background: #f6f8fa; text-align: left;
    padding: 8px 12px; border-bottom: 1px solid #e1e4e8; color: #57606a; font-weight: 600;
  }
  tbody td { padding: 6px 12px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; }
  tbody tr:nth-child(even) { background: #fafbfc; }
  tbody tr.err-row { background: #fff5f5; }
  .thumb img {
    height: 44px; border: 1px solid #e1e4e8; border-radius: 4px;
    image-rendering: pixelated; background: #fff; vertical-align: middle;
  }
  .code { font-family: "SF Mono", Consolas, Menlo, monospace; font-weight: 600; }
  .mark-ok { color: #1a7f37; font-weight: 700; font-size: 16px; }
  .mark-err { color: #cf222e; font-weight: 700; font-size: 16px; }
  .empty { text-align: center; color: #8b949e; padding: 20px; }
</style>
</head>
<body>

<div class="card">
  <h1>验证码识别工具</h1>
  <p class="sub">调用 <code>api.py</code> 识别管线 — 支持模型选择（<code>models/*.onnx</code>）与批量对比测试</p>

  <div class="field">
    <label for="modelSel">识别模型</label>
    <select id="modelSel">
      <option value="">不选择（内置 ddddocr 多策略投票）</option>
    </select>
  </div>

  <div class="drop" id="drop">
    <p>点击选择图片，或将图片拖到这里</p>
    <small>支持 png / jpg / jpeg / bmp / webp 等常见格式</small>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <div class="preview" id="previewWrap"><img id="preview" alt="预览"></div>

  <button class="btn" id="btn" disabled>识别</button>

  <div class="result" id="result">
    <div class="text-box">
      <span class="lbl">验证码</span>
      <span class="captcha" id="captcha"></span>
    </div>
    <div class="meta">
      置信度 <span id="conf">0</span>　·　长度 <span id="len">0</span>　·　使用模型 <span id="usedModel">内置</span>
    </div>
    <details>
      <summary>全部候选（<span id="candCount">0</span> 条）</summary>
      <ul id="candList"></ul>
    </details>
  </div>

  <div class="err" id="error"></div>
</div>

<div class="card wide">
  <h2>批量测试</h2>
  <p class="sub">选择批次目录，逐张识别并与标记值对比（<code>&lt;标记值&gt;_&lt;时间戳&gt;.png</code>）</p>

  <div class="field">
    <label for="batchSel">数据批次（<code>captcha_data/labeled/</code> 下的目录）</label>
    <select id="batchSel"><option value="">— 加载中 —</option></select>
  </div>
  <div class="btn-row">
    <button class="btn" id="batchBtn">开始批量测试</button>
    <button class="btn secondary" id="batchStop" disabled>停止</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <div class="batch-stats" id="batchStats">
    共 <span class="stat" id="statTotal">0</span> 张　·　一致 <span class="stat ok" id="statOk">0</span>
    　·　不一致 <span class="stat bad" id="statBad">0</span>　·　一致率 <span class="stat" id="statRate">0%</span>
  </div>
  <label class="filter" id="filterWrap"><input type="checkbox" id="filterBad"> 只看不一致</label>

  <div class="table-wrap" id="tableWrap">
    <table id="batchTable">
      <thead>
        <tr><th>图片</th><th>标记值</th><th>识别值</th><th>对比</th></tr>
      </thead>
      <tbody id="batchBody"></tbody>
    </table>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let currentFile = null;
let batchJobId = null;
let batchResults = [];
let batchName = "";

// ---- 初始化: 加载模型列表与批次列表 ----
async function loadMeta() {
  try {
    const [m, b] = await Promise.all([
      fetch("/api/models").then(r => r.json()),
      fetch("/api/batches").then(r => r.json()),
    ]);
    const modelSel = $("#modelSel");
    (m.models || []).forEach(f => {
      const opt = document.createElement("option");
      opt.value = f; opt.textContent = `模型: ${f}`;
      modelSel.appendChild(opt);
    });
    const batchSel = $("#batchSel");
    batchSel.innerHTML = "";
    (b.batches || []).forEach(d => {
      const opt = document.createElement("option");
      opt.value = d; opt.textContent = d;
      batchSel.appendChild(opt);
    });
    if (!batchSel.options.length) {
      batchSel.innerHTML = '<option value="">（没有批次目录）</option>';
    }
  } catch (e) {
    console.error(e);
  }
}
loadMeta();

// ---- 单图识别 ----
$("#drop").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => {
  if (e.target.files[0]) setFile(e.target.files[0]);
});
["dragover", "dragenter"].forEach(ev =>
  $("#drop").addEventListener(ev, e => {
    e.preventDefault();
    $("#drop").classList.add("dragover");
  }));
["dragleave", "drop"].forEach(ev =>
  $("#drop").addEventListener(ev, e => {
    e.preventDefault();
    $("#drop").classList.remove("dragover");
  }));
$("#drop").addEventListener("drop", e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) setFile(f);
});

function setFile(f) {
  currentFile = f;
  $("#preview").src = URL.createObjectURL(f);
  $("#previewWrap").style.display = "block";
  $("#btn").disabled = false;
  hideError();
  hideResult();
}

$("#btn").addEventListener("click", async () => {
  if (!currentFile) return;
  $("#btn").disabled = true;
  $("#btn").textContent = "识别中…";
  try {
    const b64 = await fileToBase64(currentFile);
    const r = await fetch("/api/recognize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: b64, model: $("#modelSel").value }),
    });
    const d = await r.json();
    if (!r.ok) { showError(d.error || "识别失败"); return; }
    showResult(d);
  } catch (e) {
    showError(String(e && e.message || e));
  } finally {
    $("#btn").textContent = "识别";
    if (currentFile) $("#btn").disabled = false;
  }
});

function fileToBase64(f) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = () => reject(r.error || new Error("读取文件失败"));
    r.readAsDataURL(f);
  });
}

function showResult(d) {
  $("#captcha").textContent = d.text || "(空)";
  $("#conf").textContent = (d.confidence * 100).toFixed(1) + "%";
  $("#len").textContent = d.length;
  $("#usedModel").textContent = d.model || "内置";
  $("#candCount").textContent = (d.candidates || []).length;
  $("#candList").innerHTML = (d.candidates || []).map(c =>
    `<li><span class="lbl2">${esc(c.label)}</span><span class="txt2">${esc(c.text)}</span></li>`
  ).join("");
  $("#result").style.display = "block";
  hideError();
}

function showError(msg) {
  $("#error").textContent = msg;
  $("#error").style.display = "block";
  hideResult();
}
function hideError() { $("#error").style.display = "none"; }
function hideResult() { $("#result").style.display = "none"; }

// ---- 批量测试 ----
$("#batchBtn").addEventListener("click", startBatch);
$("#batchStop").addEventListener("click", stopBatch);
$("#filterBad").addEventListener("change", renderTable);

async function startBatch() {
  const model = $("#modelSel").value;
  const batch = $("#batchSel").value;
  if (!batch) { showError("请先选择数据批次"); return; }
  batchName = batch;
  $("#batchBtn").disabled = true;
  $("#batchStop").disabled = false;
  $("#batchStats").style.display = "none";
  $("#filterWrap").style.display = "none";
  $("#tableWrap").style.display = "none";
  $("#batchBody").innerHTML = "";
  $("#progressWrap").style.display = "block";
  setProgress(0, 0);
  try {
    const r = await fetch("/api/batch/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, batch }),
    });
    const d = await r.json();
    if (!r.ok) { showError(d.error || "启动失败"); resetBatchUI(); return; }
    batchJobId = d.job_id;
    pollStatus();
  } catch (e) {
    showError(String(e && e.message || e));
    resetBatchUI();
  }
}

function stopBatch() {
  if (!batchJobId) return;
  fetch("/api/batch/cancel", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ job_id: batchJobId }),
  }).catch(() => {});
  $("#batchStop").disabled = true;
  $("#progressText").textContent = "正在停止…";
}

async function pollStatus() {
  while (batchJobId) {
    try {
      const r = await fetch("/api/batch/status?job_id=" + batchJobId);
      const d = await r.json();
      if (!r.ok) { showError(d.error || "查询进度失败"); break; }
      setProgress(d.processed, d.total);
      if (d.status === "done" || d.status === "canceled") {
        await loadResult();
        break;
      }
    } catch (e) {
      showError(String(e && e.message || e));
      break;
    }
    await new Promise(res => setTimeout(res, 500));
  }
}

async function loadResult() {
  const r = await fetch("/api/batch/result?job_id=" + batchJobId);
  const d = await r.json();
  if (!r.ok) { showError(d.error || "获取结果失败"); resetBatchUI(); return; }
  batchResults = d.results || [];
  const total = batchResults.length;
  const matched = batchResults.filter(x => x.match).length;
  $("#statTotal").textContent = total;
  $("#statOk").textContent = matched;
  $("#statBad").textContent = total - matched;
  $("#statRate").textContent = total ? (matched / total * 100).toFixed(1) + "%" : "0%";
  $("#batchStats").style.display = "block";
  $("#filterWrap").style.display = "block";
  $("#progressWrap").style.display = "none";
  resetBatchUI();
  renderTable();
}

function resetBatchUI() {
  $("#batchBtn").disabled = false;
  $("#batchStop").disabled = true;
  batchJobId = null;
}

function setProgress(processed, total) {
  $("#progressFill").style.width = total ? (processed / total * 100) + "%" : "0%";
  $("#progressText").textContent = `${processed} / ${total}`;
}

function renderTable() {
  const onlyBad = $("#filterBad").checked;
  const rows = onlyBad ? batchResults.filter(x => !x.match) : batchResults;
  const body = $("#batchBody");
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="4" class="empty">无数据</td></tr>';
  } else {
    body.innerHTML = rows.map(x => {
      const mark = x.match
        ? '<span class="mark-ok" title="一致">✓</span>'
        : '<span class="mark-err" title="不一致">✗</span>';
      return `<tr class="${x.match ? "" : "err-row"}">
        <td class="thumb"><img loading="lazy" src="/api/image?batch=${enc(batchName)}&file=${enc(x.filename)}" alt=""></td>
        <td class="code">${esc(x.label)}</td>
        <td class="code">${esc(x.prediction || "(空)")}</td>
        <td>${mark}</td>
      </tr>`;
    }).join("");
  }
  $("#tableWrap").style.display = "block";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function enc(s) {
  return encodeURIComponent(s);
}
</script>
</body>
</html>
